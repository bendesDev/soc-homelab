---
- name: Configura esta máquina
  hosts: local
  become: false
  roles:
    - { role: packages, tags: packages }
    - { role: dns, tags: dns }
    - { role: network, tags: network }
    - { role: storage, tags: storage }
    - { role: docker, tags: docker }
    - { role: dotfiles, tags: dotfiles }
    - { role: media, tags: media }
    - { role: soc_lab, tags: soc_lab }
    - { role: wazuh_syslog, tags: wazuh_syslog }
    - { role: wazuh_agent, tags: wazuh_agent }
    - { role: grafana, tags: grafana }
    - { role: pentest_network, tags: pentest_network }
    - { role: kali, tags: kali }
    - { role: libvirt, tags: libvirt }
    - { role: windows_vm, tags: windows_vm }
    - { role: linux_target, tags: linux_target }
    - { role: dashboard, tags: dashboard }

- name: Configura as VMs Windows do pentest_lab (via WinRM)
  hosts: windows_vms
  become: false
  roles:
    - { role: sysmon, tags: sysmon }
    - { role: atomic_red_team_windows, tags: atomic_red_team }

- name: Configura o alvo Linux do pentest_lab (via SSH)
  hosts: linux_targets
  become: false
  roles:
    - { role: wazuh_agent_linux, tags: wazuh_agent_linux }
    - { role: atomic_red_team_linux, tags: atomic_red_team }
