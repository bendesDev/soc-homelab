---
- name: Criar diretório de configuração adicional do dnsmasq
  ansible.builtin.file:
    path: /etc/dnsmasq.d
    state: directory
    mode: "0755"
  become: true

- name: Escrever registros do domínio {{ dns_domain }}
  ansible.builtin.template:
    src: lab-hosts.j2
    dest: /etc/dnsmasq.d/lab-hosts
    mode: "0644"
  become: true
  notify: Restart dnsmasq

- name: Configurar dnsmasq
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    mode: "0644"
  become: true
  notify: Restart dnsmasq

- name: Habilitar e iniciar o dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started
  become: true

- name: Criar diretório de drop-in do systemd-resolved
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  become: true

- name: Rotear consultas do domínio {{ dns_domain }} para o dnsmasq local
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/lab.conf
    content: |
      # Gerenciado pelo Ansible (roles/dns) — não editar à mão.
      [Resolve]
      DNS=127.0.0.1
      Domains=~{{ dns_domain }}
    mode: "0644"
  become: true
  notify: Restart systemd-resolved

- name: Aplicar handlers desta role imediatamente
  # Sem isso, os restarts só rodariam no fim do playbook inteiro — se uma
  # role depois desta falhar (ex.: soc_lab), dnsmasq/systemd-resolved
  # ficam com a config nova escrita em disco mas nunca recarregada.
  ansible.builtin.meta: flush_handlers
