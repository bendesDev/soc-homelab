---
- name: Desmontar e remover do fstab o ponto de montagem antigo do disco
  ansible.posix.mount:
    path: "{{ storage_old_mount_point }}"
    state: absent
  become: true

- name: Criar tabela de partições GPT com uma única partição ocupando o disco
  community.general.parted:
    device: "{{ storage_disk }}"
    label: gpt
    number: 1
    state: present
    part_start: 0%
    part_end: 100%
  become: true

- name: Formatar a partição como ext4
  # force fica false por padrão: o módulo ignora a checagem de
  # idempotência (same_fs) quando force=true e reformataria a cada
  # execução. Só ligar via -e storage_format_force=true na primeira vez
  # que este dev tiver um filesystem diferente de ext4 (ex.: disco novo).
  community.general.filesystem:
    dev: "{{ storage_partition }}"
    fstype: ext4
    force: "{{ storage_format_force }}"
    opts: "-L {{ storage_label }}"
  become: true

- name: Montar o disco de armazenamento
  ansible.posix.mount:
    path: "{{ storage_mount_point }}"
    src: "{{ storage_partition }}"
    fstype: ext4
    state: mounted
  become: true
